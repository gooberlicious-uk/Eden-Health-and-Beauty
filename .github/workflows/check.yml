name: Check site

on:
  pull_request:
  workflow_call:

jobs:
  links:
    name: Broken links and images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check internal links, images, scripts and stylesheets
        run: python3 .github/scripts/check_links.py edenhealthandbeautyspa.co.uk
